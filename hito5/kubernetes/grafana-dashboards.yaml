# =============================================================================
# Grafana Dashboards ConfigMap — CARDIS (Hito 5, Bloque 3)
# -----------------------------------------------------------------------------
# Tres filas:
#   Operativa : RPS, latencia p50/p95/p99, error rate, in-flight, CPU, RAM
#   Modelo    : rate positivos, distribución probabilidades, age warnings
#   Deriva    : drift_dataset, share_columns, drift por feature (B4)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: cardis-grafana-dashboards
  namespace: cardis
  labels:
    app: cardis-grafana
    component: monitoring
data:
  cardis.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Observabilidad del sistema CARDIS: métricas operativas, de modelo y de deriva.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "row",
          "id": 20,
          "title": "🔧 Operativa",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "id": 1,
          "title": "RPS por endpoint",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "sum(rate(cardis_http_requests_total[1m])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "gauge",
          "id": 2,
          "title": "In-flight requests",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "cardis_in_flight_requests",
              "legendFormat": "In-flight requests",
              "refId": "A"
            }
          ],
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 20,
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10.0
                  },
                  {
                    "color": "red",
                    "value": 16.0
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Error rate (5xx)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "sum(rate(cardis_http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(cardis_http_requests_total[5m]))",
              "legendFormat": "Error rate (5xx)",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 4,
          "title": "Latencia /predict (p50/p95/p99)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "histogram_quantile(0.50, sum(rate(cardis_http_request_duration_seconds_bucket{endpoint=\"/predict\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "histogram_quantile(0.95, sum(rate(cardis_http_request_duration_seconds_bucket{endpoint=\"/predict\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "histogram_quantile(0.99, sum(rate(cardis_http_request_duration_seconds_bucket{endpoint=\"/predict\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "CPU inferer (cores)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"cardis\",pod=~\"cardis-inferer.*\",container!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "RAM inferer",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"cardis\",pod=~\"cardis-inferer.*\",container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "id": 21,
          "title": "🤖 Modelo",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Rate predicciones positivas",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "rate(cardis_predictions_total{label_predicho=\"1\"}[5m])",
              "legendFormat": "positivas",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "rate(cardis_predictions_total{label_predicho=\"0\"}[5m])",
              "legendFormat": "negativas",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Probabilidades predichas (buckets)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "rate(cardis_prediction_probability_bucket[5m])",
              "legendFormat": "le={{le}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "hidden"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Age warnings rate (< 56 años)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 18
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "rate(cardis_age_warnings_total[5m])",
              "legendFormat": "warnings/s",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "id": 22,
          "title": "📉 Deriva (métricas disponibles en Bloque 4)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "Dataset drift (0=no drift, 1=drift)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "cardis_drift_dataset",
              "legendFormat": "drift detectado",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 11,
          "title": "Fracción columnas con drift",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 27
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "cardis_drift_share_columns",
              "legendFormat": "share",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.2
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "Drift por feature (0=ok, 1=drift)",
          "datasource": {
            "type": "prometheus",
            "uid": "cardis-prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 27
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cardis-prometheus"
              },
              "expr": "cardis_drift_column",
              "legendFormat": "{{feature}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 2
              },
              "unit": "short"
            },
            "overrides": []
          }
        }
      ],
      "refresh": "15s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "cardis",
        "observabilidad",
        "hito5"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "CARDIS — Observabilidad",
      "uid": "cardis-main",
      "version": 1
    }
