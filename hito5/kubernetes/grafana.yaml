# =============================================================================
# Grafana — Stack de observabilidad CARDIS (Hito 5, Bloque 3)
# -----------------------------------------------------------------------------
# Credenciales en Secret (no hardcodeadas en imagen).
# Acceso: kubectl port-forward -n cardis svc/cardis-grafana 3000:3000
# Login: admin / cardis-grafana
# Recursos: Secret + Deployment + Service (ClusterIP :3000)
# Los ConfigMaps de provisioning están en grafana-provisioning.yaml.
# Los dashboards JSON están en grafana-dashboards.yaml.
# =============================================================================

# ---------------------------------------------------------------------------
# Secret con credenciales de admin
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cardis-grafana-secret
  namespace: cardis
  labels:
    app: cardis-grafana
    component: monitoring
type: Opaque
stringData:
  # Simplificación aceptable para proyecto académico; documentada en §10 memoria.
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "cardis-grafana"
---
# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardis-grafana
  namespace: cardis
  labels:
    app: cardis-grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardis-grafana
  template:
    metadata:
      labels:
        app: cardis-grafana
        component: monitoring
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          envFrom:
            - secretRef:
                name: cardis-grafana-secret
          env:
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: cardis-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: cardis-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: cardis-grafana-dashboards
---
# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: cardis-grafana
  namespace: cardis
  labels:
    app: cardis-grafana
    component: monitoring
spec:
  selector:
    app: cardis-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
