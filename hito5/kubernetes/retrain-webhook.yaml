apiVersion: v1
kind: ServiceAccount
metadata:
  name: cardis-webhook-sa
  namespace: cardis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cardis-webhook-role
  namespace: cardis
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cardis-webhook-rb
  namespace: cardis
subjects:
  - kind: ServiceAccount
    name: cardis-webhook-sa
    namespace: cardis
roleRef:
  kind: Role
  name: cardis-webhook-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardis-retrain-webhook
  namespace: cardis
spec:
  selector:
    matchLabels:
      app: retrain-webhook
  template:
    metadata:
      labels:
        app: retrain-webhook
    spec:
      serviceAccountName: cardis-webhook-sa
      containers:
        - name: webhook
          image: cardis/retrain-webhook:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: NAMESPACE
              value: "cardis"
            - name: JOB_NAME
              value: "cardis-trainer"
---
apiVersion: v1
kind: Service
metadata:
  name: cardis-retrain-webhook
  namespace: cardis
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: retrain-webhook